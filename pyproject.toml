[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hysys-reactor-agent"
version = "0.2.0"
description = "Python reactor selection workflow and durable local task runner"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
hysys-agent = "app:main"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["src*", "config*", "examples*"]
namespaces = true

[tool.setuptools.package-data]
examples = ["*.json"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
